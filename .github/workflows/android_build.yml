name: Build Android TV Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          elif [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -mindepth 1 -maxdepth 1 | tail -n 1)
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          else
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk-bundle" >> $GITHUB_ENV
          fi

      - name: Compile Native C++ Proxy (.so)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          
          # Compile arm64-v8a shared library
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
            -shared -fPIC -std=c++17 -O3 \
            app/src/main/cpp/native_proxy.cpp \
            -o app/src/main/jniLibs/arm64-v8a/libnative_proxy.so -llog

          # Compile armeabi-v7a shared library
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++ \
            -shared -fPIC -std=c++17 -O3 \
            app/src/main/cpp/native_proxy.cpp \
            -o app/src/main/jniLibs/armeabi-v7a/libnative_proxy.so -llog

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinflex-TVLauncher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
